services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      OPTIFLOW_DOMAIN: ${OPTIFLOW_DOMAIN:?Set the public domain in deploy.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy_data:/data
      - proxy_config:/config
    depends_on:
      - optiflow
volumes:
  proxy_data:
  proxy_config:
